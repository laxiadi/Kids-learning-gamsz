.lg{font-family:inherit;direction:rtl;color:#f4f6ff;background:radial-gradient(circle at 20% 0%,#2d3a8c 0%,#151b46 55%,#0d1030 100%);border-radius:20px;padding:14px;min-height:560px;box-sizing:border-box;-webkit-tap-highlight-color:transparent;line-height:1.45}
.lg *{box-sizing:border-box}
.lg-en{unicode-bidi:isolate;direction:ltr;font-weight:700}
.lg-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.lg-title{font-size:22px;font-weight:800;margin:0}
.lg-sub{font-size:14px;opacity:.8;margin:2px 0 0}
.lg-stats{display:flex;flex-wrap:wrap;gap:6px}
.lg-pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.lg-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lg-btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;min-height:50px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;touch-action:manipulation}
.lg-btn:active{transform:scale(.97)}
.lg-main{background:#ffcb05;color:#1a1a40}
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lg-area{text-align:right;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);border-radius:18px;padding:12px;color:#fff;font:inherit;cursor:pointer;min-height:130px;display:flex;flex-direction:column;gap:4px}
.lg-area.lock{opacity:.5}
.lg-area .e{font-size:34px}
.lg-area .n{font-size:17px;font-weight:800}
.lg-area .t{font-size:13px;opacity:.85}
.lg-area .s{font-size:13px;margin-top:auto}
.lg-card{background:rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-bottom:12px}
.lg-q{font-size:24px;font-weight:700;text-align:center;margin:10px 0 6px;word-break:break-word}
.lg-cue{font-size:56px;text-align:center}
.lg-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.lg-opt{appearance:none;border:3px solid transparent;border-radius:16px;padding:14px 10px;min-height:62px;font:inherit;font-size:20px;font-weight:700;background:#fff;color:#1a1a40;cursor:pointer;touch-action:manipulation}
.lg-opt.ok{background:#2ecc71;color:#fff}
.lg-opt.bad{background:#ff5c5c;color:#fff}
.lg-opt:disabled{cursor:default}
.lg-fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:17px}
.lg-fb.ok{background:rgba(46,204,113,.25)}
.lg-fb.bad{background:rgba(255,92,92,.22)}
.lg-bar{height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.lg-bar>div{height:100%;background:#ffcb05;border-radius:99px;transition:width .3s}
.lg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.lg-cr{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.lg-blob{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 0 0 4px rgba(255,255,255,.25) inset;animation:lgb 2.4s ease-in-out infinite}
.lg-blob.s1{box-shadow:0 0 0 4px #fff inset,0 0 18px rgba(255,255,255,.5)}
.lg-blob.s2{box-shadow:0 0 0 5px #ffcb05 inset,0 0 26px #ffcb05}
.lg-blob.unk{background:rgba(255,255,255,.1)!important;filter:grayscale(1);animation:none}
@keyframes lgb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lg-tip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.lg-tip div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px;text-align:center;font-size:16px}
.lg-rule{background:#ffcb05;color:#1a1a40;border-radius:12px;padding:10px;margin-top:8px;font-weight:700;font-size:16px}
.lg-mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lg-mc{appearance:none;border:0;border-radius:14px;min-height:84px;padding:6px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ff5c5c,#c0392b);color:#fff;touch-action:manipulation}
.lg-mc.open{background:#fff;color:#1a1a40}
.lg-mc.done{background:#2ecc71;color:#fff}
.lg-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.lg-verb{appearance:none;border:3px solid transparent;border-radius:16px;padding:10px;min-height:60px;font:inherit;font-size:20px;font-weight:800;background:#3fa9ff;color:#fff;cursor:pointer;text-align:center}
.lg-verb.sel{border-color:#ffcb05;box-shadow:0 0 14px #ffcb05}
.lg-ph{appearance:none;border:0;border-radius:14px;padding:12px;min-height:54px;font:inherit;font-size:18px;font-weight:700;background:#fff;color:#1a1a40;cursor:pointer}
.lg-small{font-size:14px;opacity:.85}
.lg-list{margin:6px 0 0;padding-inline-start:20px}
.lg-say{appearance:none;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;min-height:44px;min-width:52px;font-size:20px;cursor:pointer}
.lg-h{font-size:20px;font-weight:800;margin:0 0 8px}
.lg-timer{font-size:20px;font-weight:800}
.lg-timer.low{color:#ff7a7a}
.lg-build{min-height:62px;border:2px dashed rgba(255,255,255,.35);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start;margin-top:10px}
.lg-toks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.lg-tok{appearance:none;border:0;border-radius:12px;padding:10px 14px;min-height:50px;font:inherit;font-size:19px;font-weight:700;background:#fff;color:#1a1a40;cursor:pointer;touch-action:manipulation}
.lg-tok.on{background:#ffcb05}
@media (max-width:480px){.lg{padding:10px;border-radius:14px}.lg-q{font-size:21px}.lg-opt{font-size:18px}}
