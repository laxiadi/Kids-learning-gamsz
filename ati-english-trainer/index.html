.at{font-family:inherit;direction:rtl;color:#16324f;background:linear-gradient(180deg,#bfe9ff 0%,#e6f7ff 60%,#fff6d6 100%);border-radius:22px;padding:14px;min-height:560px;box-sizing:border-box;line-height:1.45;-webkit-tap-highlight-color:transparent}
.at *{box-sizing:border-box}
.at-en{unicode-bidi:isolate;direction:ltr;font-weight:800}
.at-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.at-title{font-size:24px;font-weight:900;margin:0}
.at-pill{background:#fff;border-radius:999px;padding:6px 12px;font-size:16px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.at-note{background:#fff3c4;border:2px solid #ffd54f;border-radius:14px;padding:8px 12px;font-size:15px;margin:0 0 10px}
.at-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.at-area{appearance:none;text-align:center;background:#fff;border:3px solid #8fd3ff;border-radius:20px;padding:12px 8px;color:#16324f;font:inherit;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #8fd3ff}
.at-area:active{transform:translateY(2px)}
.at-area .e{font-size:44px}
.at-area .n{font-size:19px;font-weight:900}
.at-area .s{font-size:13px;opacity:.8}
.at-area .st{font-size:18px;letter-spacing:2px}
.at-card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.at-btn{appearance:none;border:0;border-radius:16px;padding:12px 18px;min-height:56px;font:inherit;font-size:19px;font-weight:800;cursor:pointer;background:#fff;color:#16324f;box-shadow:0 3px 0 rgba(0,0,0,.12);touch-action:manipulation}
.at-main{background:#ffcf33}
.at-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.at-instr{text-align:center;font-size:21px;font-weight:800;margin:6px 0}
.at-cue{font-size:64px;text-align:center;line-height:1.2}
.at-q{font-size:30px;font-weight:900;text-align:center;margin:8px 0;word-break:break-word}
.at-q.big{font-size:40px}
.at-hint{text-align:center;font-size:17px;opacity:.85;margin:0 0 6px}
.at-pass{direction:ltr;text-align:left;background:#e8f6ff;border-radius:16px;padding:12px 14px;font-size:24px;font-weight:700;margin:8px 0}
.at-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.at-ow{display:flex;gap:6px;align-items:stretch}
.at-opt{appearance:none;flex:1 1 auto;min-width:0;border:3px solid #8fd3ff;border-radius:18px;padding:12px 8px;min-height:72px;font:inherit;font-size:26px;font-weight:900;background:#fff;color:#16324f;cursor:pointer;touch-action:manipulation;word-break:break-word}
.at-opt.ok{background:#3ccf6e;border-color:#3ccf6e;color:#fff}
.at-opt.bad{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
.at-spk{appearance:none;border:0;border-radius:14px;min-width:48px;font-size:22px;background:#e8f6ff;cursor:pointer}
.at-fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:19px}
.at-fb.ok{background:#d9f8e3}
.at-fb.bad{background:#ffe1e1}
.at-bar{height:12px;background:#d6eefc;border-radius:99px;overflow:hidden;margin:6px 0}
.at-bar>div{height:100%;background:#ffcf33;border-radius:99px;transition:width .3s}
.at-build{min-height:70px;border:3px dashed #8fd3ff;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px;direction:ltr}
.at-toks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;direction:ltr}
.at-tok{appearance:none;border:0;border-radius:14px;padding:10px 16px;min-height:60px;min-width:56px;font:inherit;font-size:26px;font-weight:900;background:#fff;color:#16324f;box-shadow:0 3px 0 #8fd3ff;cursor:pointer;touch-action:manipulation}
.at-tok.on{background:#ffcf33;box-shadow:none}
.at-buddy{font-size:56px;text-align:center;animation:atb 2.4s ease-in-out infinite}
@keyframes atb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.at-wform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.at-wform input{font:inherit;font-size:20px;padding:10px 12px;border-radius:14px;border:3px solid #8fd3ff;background:#fff;color:#16324f;min-height:56px;min-width:0;width:100%}
.at-wrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;background:#f0f9ff;border-radius:12px;padding:8px 10px;margin-top:6px}
.at-wrow .w{flex:1 1 150px;min-width:0;word-break:break-word;font-size:19px}
.at-mini{appearance:none;border:0;border-radius:12px;min-height:46px;min-width:46px;padding:0 10px;font:inherit;font-size:17px;font-weight:800;background:#e8f6ff;color:#16324f;cursor:pointer}
.at-mini.del{background:#ff6b6b;color:#fff}
.at-flash{appearance:none;border:0;width:100%;min-height:200px;border-radius:22px;background:#e8f6ff;color:#16324f;font:inherit;font-size:40px;font-weight:900;cursor:pointer;word-break:break-word;padding:12px}
.at-flash.back{background:#ffcf33}
.at-small{font-size:15px;opacity:.85}
.at-list{margin:6px 0 0;padding-inline-start:22px;font-size:18px}
@media (max-width:480px){.at{padding:10px}.at-q{font-size:26px}.at-opt{font-size:22px}.at-wform{grid-template-columns:1fr}.at-pass{font-size:20px}.at-cue{font-size:54px}}
